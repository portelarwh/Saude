name: Publicar app web (GitHub Pages)

# Publica a versão web do app em https://<usuário>.github.io/<repositório>/
# Requisito (uma vez): Settings › Pages › Build and deployment › Source: "GitHub Actions".
on:
  push:
    branches: [main, ccr-5024bebd-apalsc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build web
        run: npx expo export --platform web --output-dir dist
        env:
          CI: '1'
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: PWA (manifesto, service worker), fallback de rotas e sem Jekyll
        run: node scripts/pwa-postbuild.js dist
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
